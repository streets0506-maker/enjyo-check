<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a1a2e;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { margin: 0; color: #657786; font-size: 12px; line-height: 1.5; }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      background: #f0faf4;
      border: 1px solid #4caf50;
      border-radius: 8px;
      font-size: 12px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>🔥 炎上チェック</h1>
  <p>X（旧Twitter）の投稿欄に文章を入力すると、自動で炎上リスクをチェックします。</p>
  <div class="status">✅ 有効化中</div>
</body>
</html>
